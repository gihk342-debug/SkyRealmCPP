name: Build All Platforms

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      build_platform:
        description: 'Build target'
        required: true
        default: 'all'
        type: choice
        options: ['all', 'windows', 'ios']

jobs:
  # ============================================
  # Windows EXE build
  # ============================================
  build-windows:
    runs-on: windows-latest
    if: ${{ github.event.inputs.build_platform == 'all' || github.event.inputs.build_platform == 'windows' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 via vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/Microsoft/vcpkg.git C:/vcpkg
          C:/vcpkg/bootstrap-vcpkg.bat
          C:/vcpkg/vcpkg.exe install sdl2 sdl2-ttf sdl2-mixer --triplet x64-windows

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build_win -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        shell: pwsh
        run: |
          cmake --build build_win --config Release

      - name: Upload EXE
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SkyRealm_Windows
          path: build_win/Release/SkyRealm_Desktop.exe

  # ============================================
  # macOS build
  # ============================================
  build-macos:
    runs-on: macos-latest
    if: ${{ github.event.inputs.build_platform == 'all' || github.event.inputs.build_platform == 'ios' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2
        run: |
          brew install sdl2 sdl2_ttf sdl2_mixer

      - name: Configure CMake
        run: |
          mkdir -p build_mac
          cd build_mac
          cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build_mac -j$(sysctl -n hw.logicalcpu)

      - name: Upload macOS Binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SkyRealm_macOS
          path: build_mac/SkyRealm_Desktop