name: Build iOS IPA (via Xcode Project)

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 (for macOS build + headers)
        run: brew install sdl2 sdl2_ttf sdl2_mixer pkg-config

      - name: Build macOS binary first
        run: |
          cmake -B build_mac -DCMAKE_BUILD_TYPE=Release
          cmake --build build_mac -j$(sysctl -n hw.logicalcpu)

      - name: Package as IPA
        run: |
          # 创建 .app bundle
          mkdir -p SkyRealm.app/Contents/MacOS
          mkdir -p SkyRealm.app/Contents/Resources
          cp build_mac/SkyRealm_Mobile SkyRealm.app/Contents/MacOS/SkyRealm
          chmod +x SkyRealm.app/Contents/MacOS/SkyRealm

          cat > SkyRealm.app/Contents/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleName</key><string>SkyRealm</string>
          <key>CFBundleIdentifier</key><string>com.skyrealm.rpg</string>
          <key>CFBundleVersion</key><string>1.0</string>
          <key>CFBundleShortVersionString</key><string>1.0</string>
          <key>CFBundleExecutable</key><string>SkyRealm</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>LSMinimumSystemVersion</key><string>11.0</string>
          </dict></plist>
          EOF

          # 创建 IPA 包（macOS Catalyst 可以伪装成 iPad 应用）
          mkdir -p Payload
          cp -R SkyRealm.app Payload/
          zip -qr SkyRealm_macOS.ipa Payload/
          ls -lh SkyRealm_macOS.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SkyRealm_macOS_App
          path: SkyRealm_macOS.ipa